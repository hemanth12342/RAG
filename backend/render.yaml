services:
  - type: web
    name: rag-doc-analyst-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false   # Set manually in Render dashboard → Environment
      - key: PYTHON_VERSION
        value: "3.11.0"
