services:
  - type: web
    name: rag-doc-analyst-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
    startCommand: python main.py
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false   # Set manually in Render dashboard → Environment
      - key: PYTHON_VERSION
        value: "3.11.0"
